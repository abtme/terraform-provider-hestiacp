name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: arc-runners-hestiacp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Fetches the GPG signing key fresh from OpenBao on every run via
      # GitHub's own OIDC token - no secret ever stored in GitHub. The
      # jwt-github auth mount/role is scoped to this repo's tag pushes
      # only (see auth/jwt-github/role/terraform-provider-hestiacp-release).
      - name: Fetch GPG key from OpenBao and prime gpg-agent
        env:
          BAO_ADDR: https://vault.turnbull.uk:8200
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/openbao/openbao/releases/download/v2.6.0/openbao_2.6.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" bao
          export PATH="$RUNNER_TEMP/bin:$PATH"

          JWT=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')

          BAO_TOKEN=$(bao write -field=token auth/jwt-github/login \
            role=terraform-provider-hestiacp-release jwt="$JWT")
          export VAULT_TOKEN="$BAO_TOKEN"

          bao kv get -field=private-key secret/terraform-registry/gpg | gpg --batch --import
          PASSPHRASE=$(bao kv get -field=passphrase secret/terraform-registry/gpg)
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 1200" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 1200" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

          # Priming sign: caches the unlocked key's passphrase in the running
          # gpg-agent so GoReleaser's later --batch (non-interactive) sign
          # calls succeed without needing the passphrase passed again.
          echo "priming" | gpg --batch --pinentry-mode loopback \
            --passphrase "$PASSPHRASE" --local-user "$FINGERPRINT" \
            --detach-sign --output /dev/null -

          echo "GPG_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
